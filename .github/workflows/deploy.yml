name: Deploy to Azure Container Apps
on:
  push:
    branches: [main, research-two-modes]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
env:
  IMAGE: banni-climate-lens
  APP: banni-app
  RG: banni-rg
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and push image
        run: |
          az acr login -n ${{ vars.ACR_NAME }}
          IMG=${{ vars.ACR_NAME }}.azurecr.io/$IMAGE:${{ github.sha }}
          docker build -t $IMG .
          docker push $IMG
      - name: Update container app
        run: |
          az containerapp update -n $APP -g $RG \
            --image ${{ vars.ACR_NAME }}.azurecr.io/$IMAGE:${{ github.sha }}
      - name: Health check
        run: |
          sleep 30
          FQDN=$(az containerapp show -n $APP -g $RG --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS https://$FQDN/api/health
